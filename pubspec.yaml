name: rozkladka_common
description: "Активація польових застосунків з InTrack і підписані знімки бази."
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  pointycastle: ^4.0.0
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.lubomyrf.rozkladka_common
        pluginClass: RozkladkaCommonPlugin
      ios:
        pluginClass: RozkladkaCommonPlugin
